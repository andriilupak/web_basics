<!DOCTYPE html>
<html lang="en,ua">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
  </head>
  <body>
    <h1>Моя перша HTML-форма</h1>
 
<form action="https://httpbin.org/post" method="POST">
  <p>
    <label for="username">Ім'я:</label>
    <input type="text" id="username" name="username">
  </p>
  <p>
    <label>Дата народження:
      <input type="date" name="birthdate">
    </label>
  </p>
  <p>
    <label for="email">Імейл:</label>
    <input type="email" id="email" name="email">
  </p>
  <p>
    <label>Повідомлення:
      <textarea name="message"></textarea>
    </label>
  </p>
  <fieldset>
  <legend>Ваші улюблені напої?</legend>
  <label><input type="checkbox" name="drink" value="tea"> Чайочок</label>
  <label><input type="checkbox" name="drink" value="coffee"> Кава</label>
  <label><input type="checkbox" name="drink" value="juice"> Сочок</label>
  <label><input type="checkbox" name="drink" value="water"> Водичка</label>
</fieldset>
 
<fieldset>
  <legend>Моя національність</legend>
  <label><input type="radio" name="nationality" value="ukrainian"> Українець</label>
  <label><input type="radio" name="nationality" value="hungarian"> Poland kyrva</label>
  <label><input type="radio" name="nationality" value="other"> не ко з цих неформалів</label>
</fieldset>

  <p>
    <button type="submit">Надіслати</button>
    <button type="reset">Очистити</button>
  </p>
</form>
    <picture>
  <source media="(max-width: 468px)" srcset="https://picsum.photos/300/500">
  <img src="https://picsum.photos/1000/400" alt="дуже файна фотка ">
  </picture>
    <script src="./script.js"></script>
  </body>
</html>
